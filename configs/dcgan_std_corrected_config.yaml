data:
  cats_dir: data/cats
  image_size: 64
  batch_size: 64
  num_workers: 0

model:
  z_dim: 128
  g_channels: 128          # doubled vs WGAN-GP run for extra capacity
  d_channels: 64
  image_channels: 3

training:
  epochs: 150
  lr_g: 2.0e-4
  lr_d: 2.0e-4
  beta1: 0.5
  beta2: 0.999
  label_smooth_real: 0.9
  use_gradient_penalty: false  # standard BCE loss, n_critic=1
  n_critic: 1

logging:
  output_dir: outputs/dcgan_std      # separate from WGAN-GP outputs
  checkpoint_dir: checkpoints/dcgan_std
  save_every_epochs: 10
  sample_size: 64

seed: 42   # overridden per-seed in multiseed script
