data:
  cats_dir: data/cats
  image_size: 64
  batch_size: 64
  num_workers: 0
  augment: true                # ABLATION: with augmentation

model:
  z_dim: 128
  g_channels: 64
  d_channels: 64
  image_channels: 3

training:
  epochs: 50
  lr_g: 2.0e-4
  lr_d: 2.0e-4
  beta1: 0.5
  beta2: 0.999
  label_smooth_real: 0.9
  use_gradient_penalty: true
  gp_lambda: 10.0
  n_critic: 5

logging:
  output_dir: outputs/ablation/dcgan_augmented
  checkpoint_dir: checkpoints/ablation/dcgan_augmented
  save_every_epochs: 50
  sample_size: 64

seed: 42
